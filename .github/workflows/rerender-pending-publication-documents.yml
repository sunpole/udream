name: Trim and rerender pending publication documents

on:
  push:
    branches:
      - fix/pending-publication-images-v23.8.1-v23.8.5
    paths:
      - .github/workflows/rerender-pending-publication-documents.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rerender:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pending-publication-images-v23.8.1-v23.8.5
          fetch-depth: 0

      - name: Install render validators
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin pngcheck imagemagick

      - name: Trim body text to the visible document panel
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("tools/screenshots/publication-repairs")
          files = sorted(root.glob("*.svg"))
          if len(files) != 5:
              raise SystemExit(f"Expected 5 SVG sources, found {len(files)}")

          body_pattern = re.compile(
              r'<text x="92" y="(?P<y>\d+)"[^>]*>.*?</text>',
              re.DOTALL,
          )

          for path in files:
              source = path.read_text(encoding="utf-8")
              matches = list(body_pattern.finditer(source))
              if not matches:
                  raise SystemExit(f"No document body lines found in {path}")

              removed = 0
              def keep_visible(match):
                  nonlocal_removed = int(match.group("y")) > 555
                  if nonlocal_removed:
                      return ""
                  return match.group(0)

              trimmed = body_pattern.sub(keep_visible, source)
              visible = [
                  int(match.group("y"))
                  for match in body_pattern.finditer(trimmed)
              ]
              if not visible or max(visible) > 555 or len(visible) > 10:
                  raise SystemExit(
                      f"Visible body bounds failed for {path}: {visible}"
                  )
              path.write_text(trimmed, encoding="utf-8")
              print(f"{path}: visible body lines={len(visible)}, last_y={max(visible)}")
          PY

      - name: Rerender and validate five PNG files
        run: |
          declare -a pairs=(
            "tools/screenshots/publication-repairs/v23.8.1-release-finalization.svg|news/2026-07-20-udream-v23-8-1-release-finalization.png"
            "tools/screenshots/publication-repairs/v23.8.2-version-record.svg|news/2026-07-21-udream-v23-8-2-release-record.png"
            "tools/screenshots/publication-repairs/v23.8.3-product-vision.svg|news/2026-07-21-udream-v23-8-3-product-vision.png"
            "tools/screenshots/publication-repairs/v23.8.4-translation-workflow.svg|news/2026-07-21-udream-v23-8-4-translation-workflow.png"
            "tools/screenshots/publication-repairs/v23.8.5-work-status.svg|news/2026-07-21-udream-v23-8-5-work-status.png"
          )

          for pair in "${pairs[@]}"; do
            source="${pair%%|*}"
            output="${pair##*|}"
            rsvg-convert --width 1200 --height 675 --output "$output" "$source"
            pngcheck -q "$output"
            identify "$output"
          done

          python3 - <<'PY'
          import json
          import pathlib
          from datetime import datetime, timezone

          root = pathlib.Path.cwd()
          manifest_path = root / "tools/screenshots/publication-repairs/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if len(manifest.get("entries", [])) != 5:
              raise SystemExit("Manifest must contain exactly five entries")

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          seen = set()
          for entry in manifest["entries"]:
              image_path = root / entry["imagePath"]
              data = image_path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n" or len(data) < 30_000:
                  raise SystemExit(f"Invalid rendered PNG: {entry['imagePath']}")
              if entry["image"] in seen:
                  raise SystemExit(f"Duplicate output image name: {entry['image']}")
              seen.add(entry["image"])
              entry["imageCapturedAt"] = now
              entry["width"] = int.from_bytes(data[16:20], "big")
              entry["height"] = int.from_bytes(data[20:24], "big")
              entry["bytes"] = len(data)
              entry["maxBodyBaseline"] = 555
          manifest["generatedAt"] = now
          manifest["layoutValidation"] = {
              "maxBodyLines": 10,
              "maxBodyBaseline": 555,
              "panelBottom": 587
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit corrected sources and renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            news/2026-07-20-udream-v23-8-1-release-finalization.png \
            news/2026-07-21-udream-v23-8-2-release-record.png \
            news/2026-07-21-udream-v23-8-3-product-vision.png \
            news/2026-07-21-udream-v23-8-4-translation-workflow.png \
            news/2026-07-21-udream-v23-8-5-work-status.png \
            tools/screenshots/publication-repairs/
          git commit -m "fix: constrain historical publication render layout"
          git push origin HEAD:fix/pending-publication-images-v23.8.1-v23.8.5
