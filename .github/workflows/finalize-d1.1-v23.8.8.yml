name: Finalize uDream D1.1 v23.8.8

on:
  push:
    branches:
      - docs/data-provenance-d1.1
    paths:
      - .github/workflows/finalize-d1.1-v23.8.8.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-udream-d1.1-v23.8.8
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: 48fe99480bce320c675d8846c6fbb1dd9513c000
      SOURCE_URL: https://github.com/sunpole/udream/blob/48fe99480bce320c675d8846c6fbb1dd9513c000/docs/DATA_PROVENANCE.md
      OUTPUT: news/2026-07-22-udream-v23-8-8-data-provenance.png
      PATCHNOTE: news/2026-07-22-udream-v23-8-8-data-provenance.md
      SELF: .github/workflows/finalize-d1.1-v23.8.8.yml
      OLD_CAPTURE: .github/workflows/capture-v23.8.8-data-provenance.yml
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: docs/data-provenance-d1.1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture real GitHub provenance page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/screenshots/tmp
          cat > tools/screenshots/tmp/capture-d1.1.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
          });
          await page.goto(process.env.SOURCE_URL, {
            waitUntil: "domcontentloaded",
            timeout: 120000,
          });
          await page.waitForTimeout(4000);
          const finalUrl = page.url();
          const bodyText = await page.locator("body").innerText();
          if (!finalUrl.includes(process.env.SOURCE_COMMIT)) {
            throw new Error(`Unexpected final URL: ${finalUrl}`);
          }
          if (!bodyText.includes("DATA_PROVENANCE.md") && !bodyText.includes("Data provenance")) {
            throw new Error("Expected provenance document title is not visible.");
          }
          if (!bodyText.includes("4,086") && !bodyText.includes("4086")) {
            throw new Error("Expected 4,086-record evidence is not visible.");
          }
          await page.screenshot({ path: process.env.OUTPUT, fullPage: false });
          await browser.close();
          EOF
          node tools/screenshots/tmp/capture-d1.1.mjs
          rm -rf tools/screenshots/tmp

      - name: Validate PNG and update exact capture time
        shell: bash
        run: |
          set -euo pipefail
          CAPTURED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CAPTURED_AT
          python3 - <<'PY'
          import os
          import re
          import struct
          import zlib
          from pathlib import Path

          png = Path(os.environ["OUTPUT"])
          data = png.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Missing PNG signature")
          if len(data) < 100_000:
              raise SystemExit(f"PNG is unexpectedly small: {len(data)} bytes")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1440, 1000):
              raise SystemExit(f"Unexpected dimensions: {width}x{height}")

          pos = 8
          seen = []
          while pos < len(data):
              length = struct.unpack(">I", data[pos:pos+4])[0]
              kind = data[pos+4:pos+8]
              payload = data[pos+8:pos+8+length]
              expected = struct.unpack(">I", data[pos+8+length:pos+12+length])[0]
              actual = zlib.crc32(kind)
              actual = zlib.crc32(payload, actual) & 0xFFFFFFFF
              if actual != expected:
                  raise SystemExit(f"Invalid CRC for {kind.decode('ascii', 'replace')}")
              seen.append(kind)
              pos += 12 + length
          for required in (b"IHDR", b"IDAT", b"IEND"):
              if required not in seen:
                  raise SystemExit(f"Missing PNG chunk: {required!r}")

          patchnote = Path(os.environ["PATCHNOTE"])
          source = patchnote.read_text(encoding="utf-8")
          value = os.environ["CAPTURED_AT"]
          updated, count = re.subn(
              r"(?m)^screenshot_captured_at:\s*.*$",
              f"screenshot_captured_at: {value}",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("screenshot_captured_at field not found exactly once")
          patchnote.write_text(updated, encoding="utf-8")
          print(f"Validated real Chromium PNG: {width}x{height}, {len(data)} bytes, {value}")
          PY

      - name: Run D1.1 validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node scripts/validate-data-provenance.mjs
          node scripts/validate-project.mjs
          node --check scripts/validate-data-provenance.mjs
          node --check scripts/validate-project.mjs

      - name: Enforce protected-area boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(data/|versions/|_archive/|index\.html$|script\.js$|src/|sw\.js$|manifest\.json$|version\.json$|package\.json$|favicon\.svg$|icon-[0-9]+\.png$|apple-touch-icon\.png$)' ; then
            echo "D1.1 touched a protected runtime, data, saved-version or archive path." >&2
            exit 1
          fi

      - name: Record completed handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("WORK_STATUS.md")
          current = path.read_text(encoding="utf-8")
          marker = "## Быстрый сигнал"
          if marker not in current:
              raise SystemExit("WORK_STATUS.md structure is missing")

          completed = '''# WORK_STATUS — передача работы между устройствами

Этот файл — единая оперативная точка продолжения разработки uDream с телефона, Windows, macOS, другого устройства или любого ИИ-чата.

`ROADMAP.md` хранит общий план, `docs/PROJECT_STATE.md` — проверенное состояние продукта, а этот файл хранит живую текущую задачу и точку продолжения.

## Быстрый сигнал

| Поле | Текущее значение |
|---|---|
| Состояние | **COMPLETED** — D1.1 реализован и проверен; ожидается финальная проверка PR №25 и merge |
| Рабочая ветка | `docs/data-provenance-d1.1` |
| Pull Request | `#25` — `https://github.com/sunpole/udream/pull/25` |
| Стабильный функциональный релиз | `v23.8.0` |
| Документационный/provenance baseline | кандидат `23.8.8` |
| Актуальная база | 4 086 записей; bytes и SHA-256 не изменены |
| Следующий точный шаг | дождаться зелёных Actions PR №25, проверить полный diff, объединить PR, закрыть Issue №19 и вернуть `main` в `READY` для D1.2 |

## Фактически завершено

- создан `docs/DATA_PROVENANCE.md` с доказанными фактами, выводами и неизвестным;
- создан постоянный `scripts/validate-data-provenance.mjs` и подключён к общей проверке;
- доказано: `data/bd2.json` и `data/db.json` различаются физически, но являются идентичным parsed/canonical JSON;
- зафиксированы raw и canonical SHA-256, 4 086 упорядоченных ID и связь активной русской базы с английским набором;
- ошибочные промежуточные выводы удалены из поддерживаемой документации;
- временные diagnostic/workflow-файлы не входят в итоговый diff;
- создан фактический патчноут `23.8.8` и настоящий Chromium-снимок exact GitHub commit;
- regression tests, provenance-validator, project-validator, PNG integrity и syntax checks выполнены в GitHub Actions;
- файлы данных, runtime, PWA, `versions/` и `_archive/` не изменены.

## Доказанные контрольные значения

```text
data/bd2.json
814c5d33444160e6f1ab20278f9356090ec0e9cc04943cd14ad99d9038be6e28

data/db.json
4e166959d318778be57557349a152c2b466ad9db14e5634f5e5df3c87ca2cdc0

canonical English JSON
5ebe0d973f9cfd1c9db65a9d5abebe0ca16788261219299a710ed9fe78bb25d1

data/divinity_code_ru.json
1def80216e238b0c2a8640aaf1b4e95dd0669d5944a67f4e7c4421fad55a6e64
```

## Остаётся неизвестным

Точный generation/translation pipeline активной русской базы, prompt, последовательность провайдеров и подтверждённая запись человеческой редакторской проверки не восстановлены. Это явно записано как неизвестное и не подменяется предположениями.

## Запреты до merge

- не менять файлы `data/`, runtime, PWA, `versions/` или `_archive/`;
- не создавать параллельную D1.1 ветку;
- не начинать D1.2 до merge D1.1;
- не выдавать предположение за доказанный факт;
- не объединять PR при красных или незавершённых Actions.

## После merge

1. закрыть Issue №19 как `completed`;
2. обновить `main/WORK_STATUS.md` до `READY` отдельной короткой фиксацией;
3. записать merge commit и отсутствие открытых PR;
4. следующая утверждённая задача — D1.2: реестр наборов и решение о канонической физической копии без удаления данных.
'''
          path.write_text(completed, encoding="utf-8")
          PY

      - name: Remove one-time workflows and commit final evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$SELF" "$OLD_CAPTURE"
          git add -A
          git commit -m "docs: complete D1.1 evidence and handoff"
          git push origin HEAD:docs/data-provenance-d1.1
