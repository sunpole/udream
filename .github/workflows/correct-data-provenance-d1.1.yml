name: Generate corrected D1.1 provenance evidence

on:
  push:
    branches:
      - docs/data-provenance-d1.1
    paths:
      - .github/workflows/correct-data-provenance-d1.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          ref: docs/data-provenance-d1.1
          fetch-depth: 0

      - name: Generate corrected evidence
        run: |
          git fetch origin main
          mkdir -p diagnostics
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          from collections import Counter
          from datetime import datetime, timezone

          ROOT = pathlib.Path.cwd()
          FILES = {
              "bd2": pathlib.Path("data/bd2.json"),
              "db": pathlib.Path("data/db.json"),
              "ru": pathlib.Path("data/divinity_code_ru.json"),
          }
          REPORT = pathlib.Path("data/report.txt")

          def run(*args: str) -> str:
              return subprocess.check_output(args, cwd=ROOT, text=True).strip()

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def canonical_bytes(value: object) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")

          def language_metrics(value: object) -> dict[str, int]:
              text = json.dumps(value, ensure_ascii=False)
              return {
                  "cyrillicCharacters": len(re.findall(r"[А-Яа-яЁё]", text)),
                  "latinCharacters": len(re.findall(r"[A-Za-z]", text)),
                  "googleMarkers": text.count("[GOOGLE]"),
                  "myMemoryMarkers": text.count("[MYMEMORY]"),
              }

          def inspect(name: str, path: pathlib.Path) -> dict[str, object]:
              raw = path.read_bytes()
              value = json.loads(raw.decode("utf-8-sig"))
              if not isinstance(value, list):
                  raise SystemExit(f"{path} must contain a JSON array")
              if not all(isinstance(item, dict) for item in value):
                  raise SystemExit(f"{path} must contain objects only")
              ids = [item.get("id") for item in value]
              fields = sorted({key for item in value for key in item})
              field_presence = {
                  field: sum(1 for item in value if field in item)
                  for field in fields
              }
              field_types = {
                  field: sorted({type(item.get(field)).__name__ for item in value if field in item})
                  for field in fields
              }
              canonical = canonical_bytes(value)
              return {
                  "name": name,
                  "path": path.as_posix(),
                  "bytes": len(raw),
                  "sha256": sha256(raw),
                  "utf8Bom": raw.startswith(b"\xef\xbb\xbf"),
                  "lineCount": raw.count(b"\n") + (1 if raw else 0),
                  "records": len(value),
                  "fields": fields,
                  "fieldPresence": field_presence,
                  "fieldTypes": field_types,
                  "integerIds": sum(isinstance(value, int) for value in ids),
                  "uniqueIds": len(set(ids)),
                  "firstId": ids[0] if ids else None,
                  "lastId": ids[-1] if ids else None,
                  "canonicalBytes": len(canonical),
                  "canonicalSha256": sha256(canonical),
                  "language": language_metrics(value),
                  "value": value,
              }

          inspected = {name: inspect(name, path) for name, path in FILES.items()}

          def compare(left_name: str, right_name: str) -> dict[str, object]:
              left = inspected[left_name]["value"]
              right = inspected[right_name]["value"]
              left_by_id = {item["id"]: item for item in left}
              right_by_id = {item["id"]: item for item in right}
              shared_ids = sorted(set(left_by_id) & set(right_by_id))
              fields = sorted({key for item in left for key in item} | {key for item in right for key in item})
              field_diffs = {
                  field: sum(
                      1
                      for record_id in shared_ids
                      if left_by_id[record_id].get(field) != right_by_id[record_id].get(field)
                  )
                  for field in fields
              }
              differing_records = [
                  record_id
                  for record_id in shared_ids
                  if left_by_id[record_id] != right_by_id[record_id]
              ]
              return {
                  "left": left_name,
                  "right": right_name,
                  "byteEqual": FILES[left_name].read_bytes() == FILES[right_name].read_bytes(),
                  "parsedJsonEqual": left == right,
                  "canonicalJsonEqual": inspected[left_name]["canonicalSha256"] == inspected[right_name]["canonicalSha256"],
                  "recordOrderEqual": [item["id"] for item in left] == [item["id"] for item in right],
                  "sharedIds": len(shared_ids),
                  "leftOnlyIds": sorted(set(left_by_id) - set(right_by_id)),
                  "rightOnlyIds": sorted(set(right_by_id) - set(left_by_id)),
                  "differentRecords": len(differing_records),
                  "firstDifferingIds": differing_records[:20],
                  "fieldDifferenceCounts": field_diffs,
              }

          comparisons = {
              "bd2__db": compare("bd2", "db"),
              "bd2__ru": compare("bd2", "ru"),
              "db__ru": compare("db", "ru"),
          }

          history = {}
          for name, path in {**FILES, "report": REPORT}.items():
              output = run(
                  "git", "log", "--follow", "--date=iso-strict",
                  "--format=%H%x09%aI%x09%s", "--", path.as_posix(),
              )
              rows = []
              for line in output.splitlines():
                  if not line:
                      continue
                  commit, date, subject = line.split("\t", 2)
                  rows.append({"commit": commit, "authorDate": date, "subject": subject})
              history[name] = rows

          main_diff = run(
              "git", "diff", "--name-only", "origin/main...HEAD", "--",
              "data/divinity_code_ru.json", "data/bd2.json", "data/db.json", "data/report.txt",
          )

          report_raw = REPORT.read_bytes()
          evidence = {
              "schemaVersion": 2,
              "generatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "branch": run("git", "branch", "--show-current"),
              "commit": run("git", "rev-parse", "HEAD"),
              "mainCommit": run("git", "rev-parse", "origin/main"),
              "dataFilesDifferFromMain": [line for line in main_diff.splitlines() if line],
              "files": {
                  name: {key: value for key, value in item.items() if key != "value"}
                  for name, item in inspected.items()
              },
              "report": {
                  "path": REPORT.as_posix(),
                  "bytes": len(report_raw),
                  "sha256": sha256(report_raw),
                  "lineCount": report_raw.count(b"\n") + (1 if report_raw else 0),
              },
              "comparisons": comparisons,
              "history": history,
              "correctionsToEarlierDiagnostics": [
                  "The earlier note-based closeness metric was invalid because the actual field is notes, not note.",
                  "bd2.json and db.json are byte-different but parsed-JSON and canonical-JSON equal.",
                  "Field-level comparisons in this report are generated dynamically from the actual schema.",
              ],
          }

          output_path = pathlib.Path("diagnostics/d1.1-corrected-evidence.json")
          output_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          lines = [
              "# D1.1 corrected evidence summary",
              "",
              f"Generated: {evidence['generatedAt']}",
              f"Branch commit: {evidence['commit']}",
              f"Main commit: {evidence['mainCommit']}",
              f"Data files changed from main: {evidence['dataFilesDifferFromMain']}",
              "",
              "## Current files",
          ]
          for name, item in evidence["files"].items():
              lines.append(
                  f"- {item['path']}: {item['bytes']} bytes, sha256 {item['sha256']}, "
                  f"records {item['records']}, canonical sha256 {item['canonicalSha256']}"
              )
          lines.extend(["", "## Comparisons"])
          for key, comparison in comparisons.items():
              lines.extend([
                  f"- {key}: byteEqual={comparison['byteEqual']}, parsedJsonEqual={comparison['parsedJsonEqual']}, "
                  f"canonicalJsonEqual={comparison['canonicalJsonEqual']}, differentRecords={comparison['differentRecords']}",
                  f"  field differences: {comparison['fieldDifferenceCounts']}",
              ])
          lines.extend([
              "",
              "## Corrected conclusions",
              "- bd2.json and db.json are different serializations of the same parsed JSON dataset.",
              "- The active Russian dataset preserves the same 4,086 IDs and differs from the English dataset in aliases, notes and tags.",
              "- The exact generation/translation script for divinity_code_ru.json is not present in the proven current history.",
              "- Earlier note-based closeness claims are invalid and must not be cited.",
          ])
          pathlib.Path("diagnostics/d1.1-corrected-evidence.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Commit corrected evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/d1.1-corrected-evidence.json diagnostics/d1.1-corrected-evidence.txt
          git commit -m "chore: capture corrected D1.1 provenance evidence"
          git push origin HEAD:docs/data-provenance-d1.1
