name: Generate uDream v23.8.10 data-quality reports

on:
  push:
    branches:
      - audit/d1.3-data-quality-v23.8.10
    paths:
      - .github/workflows/generate-v23.8.10-data-quality-reports.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-udream-v23.8.10-data-quality-reports
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: audit/d1.3-data-quality-v23.8.10
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate deterministic reports
        run: node scripts/audit-data-quality.mjs

      - name: Verify generated reports and protected inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-data-quality.mjs --check
          node scripts/validate-data-provenance.mjs
          node scripts/validate-dataset-registry.mjs
          node --check scripts/audit-data-quality.mjs
          git diff --check
          changed="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$changed"
          forbidden='^(data/(bd2\.json|db\.json|divinity_code_ru\.json|report\.txt)|index\.html$|script\.js$|src/|sw\.js$|manifest\.json$|version\.json$|package\.json$|versions/|_archive/)'
          if printf '%s\n' "$changed" | grep -E "$forbidden"; then
            echo "Protected data/runtime/PWA/saved-version/archive path changed" >&2
            exit 1
          fi

      - name: Commit reports and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/data-quality-audit.json reports/data-quality-audit.md
          git rm .github/workflows/generate-v23.8.10-data-quality-reports.yml
          git commit -m "audit: add deterministic v23.8.10 quality reports"
          git push origin HEAD:audit/d1.3-data-quality-v23.8.10
