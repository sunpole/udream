name: Commit reviewed v23.8.7 Playwright image

on:
  push:
    branches:
      - ops/playwright-screenshots-v23.8.7
    paths:
      - .github/workflows/commit-v23.8.7-patchnote-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v5
        with:
          ref: ops/playwright-screenshots-v23.8.7
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/screenshots/package-lock.json

      - name: Install pinned screenshot dependencies
        working-directory: tools/screenshots
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: tools/screenshots
        run: npx playwright install --with-deps chromium

      - name: Capture reviewed Russian alias scenario
        working-directory: tools/screenshots
        env:
          SCREENSHOT_SCENARIOS: russian-alias-mobile
          SCREENSHOT_COMMIT: ${{ github.sha }}
        run: npm run capture

      - name: Copy reviewed image and provenance
        run: |
          cp \
            artifacts/screenshots/images/russian-alias-mobile.png \
            news/2026-07-22-udream-v23-8-7-playwright-screenshots.png

          cp \
            artifacts/screenshots/entries/russian-alias-mobile.json \
            tools/screenshots/v23.8.7-selected-image.json

          file news/2026-07-22-udream-v23-8-7-playwright-screenshots.png
          cat tools/screenshots/v23.8.7-selected-image.json

      - name: Commit reviewed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            news/2026-07-22-udream-v23-8-7-playwright-screenshots.png \
            tools/screenshots/v23.8.7-selected-image.json
          git commit -m "docs: add reviewed v23.8.7 Playwright screenshot"
          git push origin HEAD:ops/playwright-screenshots-v23.8.7
