name: Generate screenshot package lock

on:
  push:
    branches:
      - ops/playwright-screenshots-v23.8.7
    paths:
      - .github/workflows/generate-screenshot-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/playwright-screenshots-v23.8.7
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate lockfile without running package scripts
        working-directory: tools/screenshots
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/screenshots/package-lock.json
          git commit -m "chore: lock Playwright screenshot dependencies"
          git push origin HEAD:ops/playwright-screenshots-v23.8.7
