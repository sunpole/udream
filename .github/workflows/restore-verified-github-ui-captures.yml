name: Restore verified GitHub UI publication captures

on:
  push:
    branches:
      - fix/pending-publication-images-v23.8.1-v23.8.5
    paths:
      - .github/workflows/restore-verified-github-ui-captures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pending-publication-images-v23.8.1-v23.8.5
          fetch-depth: 0

      - name: Install image validators
        run: sudo apt-get update && sudo apt-get install -y pngcheck imagemagick

      - name: Locate original verified Playwright capture commit
        id: source
        run: |
          manifest="tools/screenshots/v23.8.1-v23.8.5-publication-repairs.json"
          capture_commit="$(git log --all --diff-filter=A --format=%H -- "$manifest" | tail -1)"
          if [ -z "$capture_commit" ]; then
            echo "Original Playwright capture commit was not found."
            exit 1
          fi
          git cat-file -e "$capture_commit:$manifest"
          echo "commit=$capture_commit" >> "$GITHUB_OUTPUT"
          echo "Original Playwright capture commit: $capture_commit"
          git show "$capture_commit:$manifest"

      - name: Restore five original PNG files and Playwright manifest
        env:
          CAPTURE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          files=(
            "news/2026-07-20-udream-v23-8-1-release-finalization.png"
            "news/2026-07-21-udream-v23-8-2-release-record.png"
            "news/2026-07-21-udream-v23-8-3-product-vision.png"
            "news/2026-07-21-udream-v23-8-4-translation-workflow.png"
            "news/2026-07-21-udream-v23-8-5-work-status.png"
            "tools/screenshots/v23.8.1-v23.8.5-publication-repairs.json"
          )

          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "$CAPTURE_COMMIT:$file" > "$file"
          done

          for image in news/2026-07-2*-udream-v23-8-*.png; do
            case "$image" in
              *v23-8-1-release-finalization.png|*v23-8-2-release-record.png|*v23-8-3-product-vision.png|*v23-8-4-translation-workflow.png|*v23-8-5-work-status.png)
                pngcheck -q "$image"
                identify "$image"
                ;;
            esac
          done

          python3 - <<'PY'
          import json
          import pathlib

          manifest_path = pathlib.Path("tools/screenshots/v23.8.1-v23.8.5-publication-repairs.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          entries = manifest.get("entries", [])
          if len(entries) != 5:
              raise SystemExit(f"Expected 5 Playwright entries, got {len(entries)}")
          if len({entry["image"] for entry in entries}) != 5:
              raise SystemExit("Playwright manifest contains duplicate image names")
          for entry in entries:
              image_path = pathlib.Path("news") / entry["image"]
              data = image_path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid PNG signature: {image_path}")
              width = int.from_bytes(data[16:20], "big")
              height = int.from_bytes(data[20:24], "big")
              if (width, height) != (entry["width"], entry["height"]):
                  raise SystemExit(f"Dimension mismatch: {image_path}")
              if len(data) != entry["bytes"]:
                  raise SystemExit(f"Byte-size mismatch: {image_path}")
              if not all(entry.get("assertions", {}).values()):
                  raise SystemExit(f"Failed historical assertion in {entry['id']}")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit restored verified UI captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            news/2026-07-20-udream-v23-8-1-release-finalization.png \
            news/2026-07-21-udream-v23-8-2-release-record.png \
            news/2026-07-21-udream-v23-8-3-product-vision.png \
            news/2026-07-21-udream-v23-8-4-translation-workflow.png \
            news/2026-07-21-udream-v23-8-5-work-status.png \
            tools/screenshots/v23.8.1-v23.8.5-publication-repairs.json
          git commit -m "fix: restore five verified GitHub UI captures"
          git push origin HEAD:fix/pending-publication-images-v23.8.1-v23.8.5
