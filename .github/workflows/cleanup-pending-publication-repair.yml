name: Clean temporary publication repair files

on:
  push:
    branches:
      - fix/pending-publication-images-v23.8.1-v23.8.5
    paths:
      - .github/workflows/cleanup-pending-publication-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pending-publication-images-v23.8.1-v23.8.5
          fetch-depth: 0

      - name: Remove one-off workflows, diagnostics and document-render fallback
        run: |
          candidates=(
            ".github/workflows/capture-pending-publication-images.yml"
            ".github/workflows/diagnose-pending-publication-pages.yml"
            ".github/workflows/render-pending-publication-documents.yml"
            ".github/workflows/rerender-pending-publication-documents.yml"
            ".github/workflows/patch-publication-repair-doc.yml"
            ".github/workflows/restore-verified-github-ui-captures.yml"
            ".github/workflows/cleanup-pending-publication-repair.yml"
            "diagnostics/pending-publication-pages.json"
            "tools/screenshots/publication-repairs"
          )

          for candidate in "${candidates[@]}"; do
            if [ -e "$candidate" ]; then
              git rm -r -- "$candidate"
            fi
          done

          test -f tools/screenshots/v23.8.1-v23.8.5-publication-repairs.json
          test ! -e tools/screenshots/publication-repairs
          test ! -e diagnostics/pending-publication-pages.json

      - name: Commit clean permanent repair set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary publication repair tooling"
          git push origin HEAD:fix/pending-publication-images-v23.8.1-v23.8.5
