name: Capture real PWA image hotfix

on:
  push:
    branches:
      - fix/unews-pwa-image-v23.8.0
    paths:
      - .github/workflows/capture-pwa-image-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact hotfix source
        uses: actions/checkout@v5
        with:
          ref: fix/unews-pwa-image-v23.8.0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/screenshots/package-lock.json

      - name: Install pinned Playwright dependencies
        working-directory: tools/screenshots
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: tools/screenshots
        run: npx playwright install --with-deps chromium

      - name: Start exact checkout
        run: |
          python3 -m http.server 8019 --bind 127.0.0.1 > /tmp/udream-http.log 2>&1 &
          echo $! > /tmp/udream-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8019/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/udream-http.log
          exit 1

      - name: Capture verified mobile install banner
        working-directory: tools/screenshots
        env:
          HOTFIX_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cat > capture-pwa-hotfix.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { chromium } from "playwright";

          const repositoryRoot = path.resolve("../..");
          const imagePath = path.join(
            repositoryRoot,
            "news/2026-07-20-udream-v23-8-0-pwa-update.png",
          );
          const provenancePath = path.join(
            repositoryRoot,
            "tools/screenshots/v23.8.0-pwa-image-repair.json",
          );
          const commit = process.env.HOTFIX_SOURCE_COMMIT;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            locale: "ru-RU",
            colorScheme: "light",
            reducedMotion: "reduce",
            serviceWorkers: "block",
          });
          const page = await context.newPage();
          await page.addInitScript(() => {
            localStorage.clear();
            sessionStorage.clear();
          });
          await page.goto("http://127.0.0.1:8019/", {
            waitUntil: "domcontentloaded",
          });
          await page.locator("[data-app-version]").first().waitFor({ state: "visible" });
          const versionText = (await page.locator("[data-app-version]").first().textContent())?.trim();
          if (versionText !== "v23.8.0") {
            throw new Error(`Unexpected runtime version: ${versionText}`);
          }
          const banner = page.locator("#udreamInstallBanner");
          await banner.waitFor({ state: "visible" });
          const title = (await banner.locator("[data-pwa-title]").textContent())?.trim();
          if (title !== "Установите UDREAM на телефон") {
            throw new Error(`Unexpected PWA banner title: ${title}`);
          }
          await banner.locator("[data-pwa-help]").click();
          await banner.locator("[data-pwa-manual]").waitFor({ state: "visible" });
          await page.addStyleTag({
            content: "*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}",
          });
          await page.evaluate(async () => {
            if (document.fonts?.ready) await document.fonts.ready;
          });
          await page.screenshot({
            path: imagePath,
            fullPage: false,
            animations: "disabled",
            caret: "hide",
          });
          const bytes = fs.readFileSync(imagePath);
          const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          if (bytes.length < 10_000 || !bytes.subarray(0, 8).equals(signature)) {
            throw new Error("Generated file is not a valid non-empty PNG");
          }
          const capturedAt = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
          fs.writeFileSync(provenancePath, `${JSON.stringify({
            schemaVersion: 1,
            scenario: "pwa-install-banner-mobile",
            sourceCommit: commit,
            capturedAt,
            pageUrl: page.url(),
            viewport: { width: 390, height: 844 },
            width: bytes.readUInt32BE(16),
            height: bytes.readUInt32BE(20),
            bytes: bytes.length,
            assertions: {
              runtimeVersion: versionText,
              bannerTitle: title,
              manualInstructionsVisible: true,
            },
          }, null, 2)}\n`, "utf8");
          console.log(fs.readFileSync(provenancePath, "utf8"));
          await browser.close();
          EOF
          node capture-pwa-hotfix.mjs
          rm capture-pwa-hotfix.mjs

      - name: Commit repaired image and provenance
        run: |
          file news/2026-07-20-udream-v23-8-0-pwa-update.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            news/2026-07-20-udream-v23-8-0-pwa-update.png \
            tools/screenshots/v23.8.0-pwa-image-repair.json
          git commit -m "fix: replace invalid v23.8.0 publication image"
          git push origin HEAD:fix/unews-pwa-image-v23.8.0
