name: Capture uDream v23.8.9 dataset registry image

on:
  push:
    branches:
      - docs/d1.2-dataset-registry-v23.8.9
    paths:
      - .github/workflows/capture-v23.8.9-dataset-registry.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-udream-v23.8.9-dataset-registry
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: 80dde35b412a8de0462f0f612fdeb0eb85e6e5ca
      SOURCE_URL: https://github.com/sunpole/udream/blob/80dde35b412a8de0462f0f612fdeb0eb85e6e5ca/docs/DATASET_REGISTRY.md
      OUTPUT: news/2026-07-23-udream-v23-8-9-dataset-registry.png
      PATCHNOTE: news/2026-07-23-udream-v23-8-9-dataset-registry.md
      WORKFLOW_FILE: .github/workflows/capture-v23.8.9-dataset-registry.yml

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: docs/d1.2-dataset-registry-v23.8.9
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Chromium tooling
        run: |
          npm ci --prefix tools/screenshots
          npx --prefix tools/screenshots playwright install --with-deps chromium

      - name: Capture exact registry document page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/screenshots/tmp
          cat > tools/screenshots/tmp/capture-v23.8.9.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
          });
          await page.goto(process.env.SOURCE_URL, {
            waitUntil: "domcontentloaded",
            timeout: 120000,
          });
          await page.waitForTimeout(3500);
          const body = await page.locator("body").innerText();
          if (!page.url().includes(process.env.SOURCE_COMMIT)) {
            throw new Error(`Unexpected final URL: ${page.url()}`);
          }
          for (const expected of [
            "Dataset registry",
            "source-divinity-code-en",
            "data/bd2.json",
            "data/db.json",
            "planned-not-executed",
          ]) {
            if (!body.includes(expected)) {
              throw new Error(`Expected registry evidence is not visible: ${expected}`);
            }
          }
          await page.screenshot({ path: process.env.OUTPUT, fullPage: false });
          await browser.close();
          EOF
          node tools/screenshots/tmp/capture-v23.8.9.mjs
          rm -rf tools/screenshots/tmp

      - name: Validate PNG and synchronize patchnote metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import struct
          import zlib
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["OUTPUT"])
          data = path.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Invalid PNG signature")
          if len(data) < 100_000:
              raise SystemExit(f"PNG is unexpectedly small: {len(data)} bytes")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1440, 1000):
              raise SystemExit(f"Unexpected PNG size: {width}x{height}")

          position = 8
          chunks = []
          while position < len(data):
              length = struct.unpack(">I", data[position:position + 4])[0]
              kind = data[position + 4:position + 8]
              payload = data[position + 8:position + 8 + length]
              expected_crc = struct.unpack(">I", data[position + 8 + length:position + 12 + length])[0]
              actual_crc = zlib.crc32(payload, zlib.crc32(kind)) & 0xffffffff
              if actual_crc != expected_crc:
                  raise SystemExit(f"Invalid PNG CRC in {kind!r}")
              chunks.append(kind)
              position += 12 + length
          for required in (b"IHDR", b"IDAT", b"IEND"):
              if required not in chunks:
                  raise SystemExit(f"Missing PNG chunk {required!r}")

          captured_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          patchnote = Path(os.environ["PATCHNOTE"])
          source = patchnote.read_text(encoding="utf-8")
          source, commit_count = re.subn(
              r"(?m)^image_commit:\s*.*$",
              f"image_commit: {os.environ['SOURCE_COMMIT']}",
              source,
              count=1,
          )
          source, time_count = re.subn(
              r"(?m)^image_captured_at:\s*.*$",
              f"image_captured_at: {captured_at}",
              source,
              count=1,
          )
          if commit_count != 1 or time_count != 1:
              raise SystemExit("Patchnote screenshot metadata fields were not found exactly once")
          patchnote.write_text(source, encoding="utf-8")
          print(f"PNG OK: {width}x{height}, {len(data)} bytes, {captured_at}")
          PY

      - name: Commit image and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT" "$PATCHNOTE"
          git rm "$WORKFLOW_FILE"
          git commit -m "docs: add real v23.8.9 registry screenshot"
          git push origin HEAD:docs/d1.2-dataset-registry-v23.8.9
