name: Capture uDream v23.8.8 provenance screenshot

on:
  push:
    branches:
      - docs/data-provenance-d1.1
    paths:
      - .github/workflows/capture-v23.8.8-data-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-udream-v23.8.8-data-provenance
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: 0b257ff27b676107976a9e7a4aa59410d98cde13
      SOURCE_URL: https://github.com/sunpole/udream/blob/0b257ff27b676107976a9e7a4aa59410d98cde13/docs/DATA_PROVENANCE.md
      OUTPUT: news/2026-07-22-udream-v23-8-8-data-provenance.png
      PATCHNOTE: news/2026-07-22-udream-v23-8-8-data-provenance.md
      WORKFLOW_FILE: .github/workflows/capture-v23.8.8-data-provenance.yml
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: docs/data-provenance-d1.1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Chromium capture dependency
        run: |
          npm ci --prefix tools/screenshots
          npx --prefix tools/screenshots playwright install --with-deps chromium

      - name: Capture exact GitHub document page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/screenshots/tmp
          cat > tools/screenshots/tmp/capture-v23.8.8.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const sourceUrl = process.env.SOURCE_URL;
          const output = process.env.OUTPUT;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
          });
          await page.goto(sourceUrl, { waitUntil: "domcontentloaded", timeout: 120000 });
          await page.waitForTimeout(3500);
          const finalUrl = page.url();
          const text = await page.locator("body").innerText();
          if (!finalUrl.includes(process.env.SOURCE_COMMIT)) {
            throw new Error(`Unexpected final URL: ${finalUrl}`);
          }
          if (!text.includes("DATA_PROVENANCE.md") && !text.includes("Data provenance")) {
            throw new Error("The expected provenance document is not visible in the GitHub page.");
          }
          if (!text.includes("4086") && !text.includes("4,086")) {
            throw new Error("The expected 4,086-record provenance evidence is not visible.");
          }
          await page.screenshot({ path: output, fullPage: false });
          await browser.close();
          EOF
          node tools/screenshots/tmp/capture-v23.8.8.mjs
          rm -rf tools/screenshots/tmp

      - name: Validate screenshot and synchronize provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import struct
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["OUTPUT"])
          data = path.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Screenshot does not have a PNG signature")
          if len(data) < 100_000:
              raise SystemExit(f"Screenshot is unexpectedly small: {len(data)} bytes")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1440, 1000):
              raise SystemExit(f"Unexpected screenshot size: {width}x{height}")

          captured_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          patchnote = Path(os.environ["PATCHNOTE"])
          source = patchnote.read_text(encoding="utf-8")
          source, commit_count = re.subn(
              r"(?m)^image_commit:\s*.*$",
              f"image_commit: {os.environ['SOURCE_COMMIT']}",
              source,
              count=1,
          )
          source, time_count = re.subn(
              r"(?m)^image_captured_at:\s*.*$",
              f"image_captured_at: {captured_at}",
              source,
              count=1,
          )
          if commit_count != 1 or time_count != 1:
              raise SystemExit("Patchnote screenshot metadata fields were not found exactly once")
          patchnote.write_text(source, encoding="utf-8")
          print(f"Validated {path}: {width}x{height}, {len(data)} bytes, {captured_at}")
          PY

      - name: Commit screenshot and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT" "$PATCHNOTE"
          git rm "$WORKFLOW_FILE"
          git commit -m "docs: add real v23.8.8 provenance screenshot"
          git push origin HEAD:docs/data-provenance-d1.1
