name: Render pending publication documents

on:
  push:
    branches:
      - fix/pending-publication-images-v23.8.1-v23.8.5
    paths:
      - .github/workflows/render-pending-publication-documents.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          ref: fix/pending-publication-images-v23.8.1-v23.8.5
          fetch-depth: 0

      - name: Install deterministic SVG and PNG validators
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin pngcheck imagemagick

      - name: Read exact historical sources and build SVG documents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_BRANCH_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p tools/screenshots/publication-repairs
          gh release view v23.8.0 \
            --repo sunpole/udream \
            --json name,tagName,targetCommitish,publishedAt,url \
            > /tmp/v23.8.0-release.json

          python3 - <<'PY'
          from __future__ import annotations

          import html
          import json
          import os
          import pathlib
          import subprocess
          import textwrap
          from datetime import datetime, timezone

          ROOT = pathlib.Path.cwd()
          SOURCE_DIR = ROOT / "tools/screenshots/publication-repairs"
          CAPTURE_COMMIT = os.environ["CAPTURE_BRANCH_COMMIT"]

          def git_show(commit: str, path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{commit}:{path}"],
                  cwd=ROOT,
                  text=True,
              )

          def clean_markdown_lines(source: str, *, limit: int = 18) -> list[str]:
              lines: list[str] = []
              in_fence = False
              for raw in source.splitlines():
                  stripped = raw.strip()
                  if stripped.startswith("```"):
                      in_fence = not in_fence
                      continue
                  if in_fence or not stripped:
                      continue
                  stripped = stripped.lstrip("#").strip()
                  if stripped.startswith("|") and stripped.endswith("|"):
                      cells = [cell.strip() for cell in stripped.strip("|").split("|")]
                      stripped = " — ".join(cell for cell in cells if cell and set(cell) != {"-"})
                  stripped = stripped.replace("**", "").replace("`", "")
                  stripped = stripped.removeprefix("- ").removeprefix("* ")
                  if not stripped or set(stripped) <= {"-", "|", ":"}:
                      continue
                  for wrapped in textwrap.wrap(stripped, width=78, break_long_words=False, break_on_hyphens=False):
                      lines.append(wrapped)
                      if len(lines) >= limit:
                          return lines
              return lines

          def render_svg(*, title: str, subtitle: str, source_label: str, source_commit: str, lines: list[str], output: pathlib.Path) -> None:
              safe_title = html.escape(title)
              safe_subtitle = html.escape(subtitle)
              safe_source = html.escape(source_label)
              safe_commit = html.escape(source_commit)
              text_nodes = []
              y = 285
              for index, line in enumerate(lines[:18]):
                  fill = "#e2e8f0" if index == 0 else "#cbd5e1"
                  weight = "700" if index == 0 else "400"
                  text_nodes.append(
                      f'<text x="92" y="{y}" fill="{fill}" font-family="DejaVu Sans, Arial, sans-serif" '
                      f'font-size="22" font-weight="{weight}">{html.escape(line)}</text>'
                  )
                  y += 30

              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
                <defs>
                  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#071426"/>
                    <stop offset="1" stop-color="#172554"/>
                  </linearGradient>
                  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#38bdf8"/>
                    <stop offset="1" stop-color="#818cf8"/>
                  </linearGradient>
                  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
                  </filter>
                </defs>
                <rect width="1200" height="675" fill="url(#bg)"/>
                <circle cx="1090" cy="70" r="180" fill="#2563eb" opacity="0.15"/>
                <circle cx="70" cy="650" r="210" fill="#06b6d4" opacity="0.10"/>
                <text x="72" y="82" fill="#7dd3fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700">uDream · проверенный исторический документ</text>
                <text x="72" y="140" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="800">{safe_title}</text>
                <text x="72" y="181" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">{safe_subtitle}</text>
                <rect x="72" y="213" width="1056" height="4" rx="2" fill="url(#line)"/>
                <rect x="72" y="245" width="1056" height="342" rx="28" fill="#0b1224" stroke="#334155" filter="url(#shadow)"/>
                {''.join(text_nodes)}
                <text x="72" y="625" fill="#94a3b8" font-family="DejaVu Sans Mono, monospace" font-size="16">Источник: {safe_source}</text>
                <text x="72" y="651" fill="#64748b" font-family="DejaVu Sans Mono, monospace" font-size="15">commit: {safe_commit}</text>
              </svg>'''
              output.write_text(svg, encoding="utf-8")

          release = json.loads(pathlib.Path("/tmp/v23.8.0-release.json").read_text(encoding="utf-8"))
          release_commit = "24dece593bea679485057d7551a2583f7f1f5acf"
          release_lines = [
              f"Название: {release['name']}",
              f"Git tag: {release['tagName']}",
              f"Target commit: {release['targetCommitish']}",
              f"Опубликован: {release['publishedAt']}",
              f"Release URL: {release['url']}",
              "Тесты, PWA-проверка и неизменность базы зафиксированы в релизной документации.",
          ]

          entries = [
              {
                  "id": "v23.8.1-release",
                  "version": "23.8.1",
                  "title": "Официальный Release v23.8.0",
                  "subtitle": "Фиксация тега, target commit и публичного GitHub Release",
                  "sourceLabel": "GitHub Release API · v23.8.0",
                  "sourceCommit": release_commit,
                  "lines": release_lines,
                  "svg": "v23.8.1-release-finalization.svg",
                  "png": "news/2026-07-20-udream-v23-8-1-release-finalization.png",
              },
              {
                  "id": "v23.8.2-version-record",
                  "version": "23.8.2",
                  "title": "Release записан как точка восстановления",
                  "subtitle": "VERSION.md после объединения документационного PR",
                  "sourceLabel": "VERSION.md",
                  "sourceCommit": "de2759670fc3979ec5ad63f57ab32754b42eb99c",
                  "lines": clean_markdown_lines(git_show("de2759670fc3979ec5ad63f57ab32754b42eb99c", "VERSION.md")),
                  "svg": "v23.8.2-version-record.svg",
                  "png": "news/2026-07-21-udream-v23-8-2-release-record.png",
              },
              {
                  "id": "v23.8.3-product-vision",
                  "version": "23.8.3",
                  "title": "Единое видение продукта",
                  "subtitle": "PRODUCT_VISION.md на историческом merge commit",
                  "sourceLabel": "docs/PRODUCT_VISION.md",
                  "sourceCommit": "75e3e9664d67f9a9e28952eab53cdb1244369ce5",
                  "lines": clean_markdown_lines(git_show("75e3e9664d67f9a9e28952eab53cdb1244369ce5", "docs/PRODUCT_VISION.md")),
                  "svg": "v23.8.3-product-vision.svg",
                  "png": "news/2026-07-21-udream-v23-8-3-product-vision.png",
              },
              {
                  "id": "v23.8.4-translation-workflow",
                  "version": "23.8.4",
                  "title": "Стратегия переводов и вариантов базы",
                  "subtitle": "TRANSLATION_WORKFLOW.md на историческом merge commit",
                  "sourceLabel": "docs/TRANSLATION_WORKFLOW.md",
                  "sourceCommit": "8adae192515de0a1cf1e0e3b9a3c85cfbe8f882a",
                  "lines": clean_markdown_lines(git_show("8adae192515de0a1cf1e0e3b9a3c85cfbe8f882a", "docs/TRANSLATION_WORKFLOW.md")),
                  "svg": "v23.8.4-translation-workflow.svg",
                  "png": "news/2026-07-21-udream-v23-8-4-translation-workflow.png",
              },
              {
                  "id": "v23.8.5-work-status",
                  "version": "23.8.5",
                  "title": "Работа с любого устройства",
                  "subtitle": "WORK_STATUS.md в завершённом baseline состоянии READY",
                  "sourceLabel": "WORK_STATUS.md",
                  "sourceCommit": "ac7dfe6b49567d29b0d994f04a3c9d315a7aaf5f",
                  "lines": clean_markdown_lines(git_show("ac7dfe6b49567d29b0d994f04a3c9d315a7aaf5f", "WORK_STATUS.md")),
                  "svg": "v23.8.5-work-status.svg",
                  "png": "news/2026-07-21-udream-v23-8-5-work-status.png",
              },
          ]

          for entry in entries:
              source_path = SOURCE_DIR / entry["svg"]
              render_svg(
                  title=entry["title"],
                  subtitle=entry["subtitle"],
                  source_label=entry["sourceLabel"],
                  source_commit=entry["sourceCommit"],
                  lines=entry["lines"],
                  output=source_path,
              )
              entry["svgPath"] = source_path.relative_to(ROOT).as_posix()
              entry["imagePath"] = entry["png"]
              entry["image"] = pathlib.Path(entry["png"]).name
              entry["imageSource"] = "document-render"
              entry["imageTarget"] = f"{entry['sourceLabel']}@{entry['sourceCommit']}"
              entry["imageCommit"] = entry["sourceCommit"]
              entry.pop("lines")
              entry.pop("svg")
              entry.pop("png")

          manifest = {
              "schemaVersion": 1,
              "project": "uDream",
              "captureBranchCommit": CAPTURE_COMMIT,
              "generatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "entries": entries,
          }
          (SOURCE_DIR / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Render and validate all PNG files
        run: |
          declare -a pairs=(
            "tools/screenshots/publication-repairs/v23.8.1-release-finalization.svg|news/2026-07-20-udream-v23-8-1-release-finalization.png"
            "tools/screenshots/publication-repairs/v23.8.2-version-record.svg|news/2026-07-21-udream-v23-8-2-release-record.png"
            "tools/screenshots/publication-repairs/v23.8.3-product-vision.svg|news/2026-07-21-udream-v23-8-3-product-vision.png"
            "tools/screenshots/publication-repairs/v23.8.4-translation-workflow.svg|news/2026-07-21-udream-v23-8-4-translation-workflow.png"
            "tools/screenshots/publication-repairs/v23.8.5-work-status.svg|news/2026-07-21-udream-v23-8-5-work-status.png"
          )

          for pair in "${pairs[@]}"; do
            source="${pair%%|*}"
            output="${pair##*|}"
            rsvg-convert --width 1200 --height 675 --output "$output" "$source"
            pngcheck -q "$output"
            identify "$output"
          done

          python3 - <<'PY'
          import json
          import pathlib
          from datetime import datetime, timezone

          root = pathlib.Path.cwd()
          path = root / "tools/screenshots/publication-repairs/manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          for entry in manifest["entries"]:
              data = (root / entry["imagePath"]).read_bytes()
              if len(data) < 30_000 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid rendered PNG: {entry['imagePath']}")
              entry["imageCapturedAt"] = now
              entry["width"] = int.from_bytes(data[16:20], "big")
              entry["height"] = int.from_bytes(data[20:24], "big")
              entry["bytes"] = len(data)
          manifest["generatedAt"] = now
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit exact document renders and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            news/2026-07-20-udream-v23-8-1-release-finalization.png \
            news/2026-07-21-udream-v23-8-2-release-record.png \
            news/2026-07-21-udream-v23-8-3-product-vision.png \
            news/2026-07-21-udream-v23-8-4-translation-workflow.png \
            news/2026-07-21-udream-v23-8-5-work-status.png \
            tools/screenshots/publication-repairs/
          git commit -m "fix: add five exact historical publication renders"
          git push origin HEAD:fix/pending-publication-images-v23.8.1-v23.8.5
