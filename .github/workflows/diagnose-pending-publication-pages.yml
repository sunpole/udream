name: Diagnose pending publication pages

on:
  push:
    branches:
      - fix/pending-publication-images-v23.8.1-v23.8.5
    paths:
      - .github/workflows/diagnose-pending-publication-pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pending-publication-images-v23.8.1-v23.8.5
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/screenshots/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: tools/screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Diagnose all target pages without failing early
        working-directory: tools/screenshots
        run: |
          cat > diagnose-publication-pages.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { chromium } from "playwright";

          const repositoryRoot = path.resolve("../..");
          const targets = [
            {
              id: "v23.8.1-release",
              url: "https://github.com/sunpole/udream/releases/tag/v23.8.0",
              assertions: ["uDream v23.8.0", "v23.8.0"],
            },
            {
              id: "v23.8.2-version-record",
              url: "https://github.com/sunpole/udream/blob/de2759670fc3979ec5ad63f57ab32754b42eb99c/VERSION.md",
              assertions: ["Current release checkpoint", "v23.8.0"],
            },
            {
              id: "v23.8.3-product-vision",
              url: "https://github.com/sunpole/udream/blob/75e3e9664d67f9a9e28952eab53cdb1244369ce5/docs/PRODUCT_VISION.md",
              assertions: ["Видение продукта uDream", "Миссия"],
            },
            {
              id: "v23.8.4-translation-workflow",
              url: "https://github.com/sunpole/udream/blob/8adae192515de0a1cf1e0e3b9a3c85cfbe8f882a/docs/TRANSLATION_WORKFLOW.md",
              assertions: ["Переводы и AI-assisted workflow", "Целевой набор данных"],
            },
            {
              id: "v23.8.5-work-status",
              url: "https://github.com/sunpole/udream/blob/ac7dfe6b49567d29b0d994f04a3c9d315a7aaf5f/WORK_STATUS.md",
              assertions: ["WORK_STATUS", "READY", "v23.8.5"],
            },
          ];

          const browser = await chromium.launch({ headless: true });
          const report = [];

          for (const target of targets) {
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              locale: "en-US",
              colorScheme: "light",
              reducedMotion: "reduce",
            });
            const page = await context.newPage();
            const entry = {
              id: target.id,
              requestedUrl: target.url,
              assertions: {},
            };
            try {
              const response = await page.goto(target.url, {
                waitUntil: "domcontentloaded",
                timeout: 60_000,
              });
              entry.httpStatus = response?.status() ?? null;
              entry.finalUrl = page.url();
              entry.title = await page.title();
              await page.waitForTimeout(2500);
              const bodyText = await page.locator("body").innerText().catch(() => "");
              entry.bodyPreview = bodyText.replace(/\s+/g, " ").slice(0, 1500);
              for (const assertion of target.assertions) {
                entry.assertions[assertion] = bodyText.includes(assertion);
              }
              entry.success = Object.values(entry.assertions).every(Boolean);
            } catch (error) {
              entry.success = false;
              entry.error = `${error.name}: ${error.message}`.slice(0, 1000);
              entry.finalUrl = page.url();
              entry.title = await page.title().catch(() => "");
            }
            report.push(entry);
            await context.close();
          }

          await browser.close();
          const output = path.join(repositoryRoot, "diagnostics/pending-publication-pages.json");
          fs.mkdirSync(path.dirname(output), { recursive: true });
          fs.writeFileSync(output, `${JSON.stringify({
            generatedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            report,
          }, null, 2)}\n`, "utf8");
          console.log(fs.readFileSync(output, "utf8"));
          EOF

          node diagnose-publication-pages.mjs
          rm diagnose-publication-pages.mjs

      - name: Commit sanitized diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pending-publication-pages.json
          git commit -m "chore: capture pending publication page diagnostics"
          git push origin HEAD:fix/pending-publication-images-v23.8.1-v23.8.5
