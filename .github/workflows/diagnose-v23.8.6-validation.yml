name: Diagnose v23.8.6 validation

on:
  push:
    branches:
      - ops/unified-ai-workflow-v23.8.6
    paths:
      - .github/workflows/diagnose-v23.8.6-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/unified-ai-workflow-v23.8.6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exact validator output
        run: |
          mkdir -p diagnostics
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            node scripts/validate-project.mjs
          } > diagnostics/v23.8.6-validation.txt 2>&1 || true
          cat diagnostics/v23.8.6-validation.txt

      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/v23.8.6-validation.txt
          git commit -m "chore: capture v23.8.6 validation output"
          git push origin HEAD:ops/unified-ai-workflow-v23.8.6
