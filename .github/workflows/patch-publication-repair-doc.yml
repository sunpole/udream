name: Document batch unpublished image repairs

on:
  push:
    branches:
      - fix/pending-publication-images-v23.8.1-v23.8.5
    paths:
      - .github/workflows/patch-publication-repair-doc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pending-publication-images-v23.8.1-v23.8.5
          fetch-depth: 0

      - name: Replace only the unpublished repair section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/NEWS_PUBLISHING.md")
          source = path.read_text(encoding="utf-8")
          start = "## Ремонт ещё не опубликованного повреждённого изображения\n"
          end = "## Типы публикаций\n"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit("Expected publication repair section markers exactly once")

          before, remainder = source.split(start, 1)
          _, after = remainder.split(end, 1)
          replacement = '''## Ремонт ещё не опубликованных изображений

Обычное правило остаётся неизменным: новая работа создаёт новый патчноут и новый реальный файл изображения. Исключение допускается только для записи, которая уже находится в `news/`, но ещё не имеет Telegram `message_id` в `data/published.json` uNews.

Ремонт может быть одиночным или пакетным, когда один аудит обнаружил несколько связанных проблем. Он не создаёт новые версии и не меняет место записей в FIFO.

Допустимы только два явных режима:

```yaml
publication_repair: unpublished-invalid-image
```

Используется, когда старый PNG/JPEG доказанно имеет неверную сигнатуру, повреждённую внутреннюю структуру, неверный PNG CRC, отсутствующий обязательный chunk или не декодируется проверяемым обработчиком.

```yaml
publication_repair: unpublished-image-upgrade
```

Используется, когда несколько неопубликованных патчноутов повторно используют одну технически исправную, но нерелевантную общую картинку. Каждая запись получает новый отдельный кадр, который доказывает именно её изменение.

Для обоих режимов обязательны:

- `publication_repair_reason` с фактической причиной;
- неизменные `project`, `series`, `version` и `queued_at`;
- отсутствие записи в опубликованном состоянии uNews;
- новый или заменённый PNG/JPEG в том же Pull Request;
- уникальное имя изображения для каждого отремонтированного патчноута;
- обязательные `image_source`, `image_target`, `image_commit`, `image_captured_at`;
- реальный Playwright, GitHub UI или document-render из точного commit;
- проверка сигнатуры, размера, PNG CRC, `IHDR`, `IDAT`, `IEND` и отсутствия лишних байтов после `IEND`;
- содержательная проверка текста, границ макета и соответствия заявленному патчу;
- сохранённый SVG/JSON/manifest, когда используется document-render;
- отсутствие secrets, cookies, приватных данных и локальных домашних путей.

Для `unpublished-invalid-image` CI дополнительно читает старый файл из base-ветки и доказывает его техническую невалидность. Новый файл может сохранить прежнее имя или получить отдельное имя, но обязан быть добавлен или изменён в том же PR.

Для `unpublished-image-upgrade` CI дополнительно доказывает, что старое изображение использовалось несколькими ремонтируемыми патчноутами, требует новый добавленный файл и запрещает повторное использование нового изображения между записями.

`scripts/validate-patchnote-diff.mjs` проверяет весь пакет как одно изменение: FIFO-поля, repair-marker, причину, уникальность файлов, существование исторических commits и глубокую структуру PNG/JPEG. `scripts/validate-project.mjs` продолжает проверять repaired images после merge.

Опубликованные посты нельзя исправлять этим режимом. Если `message_id` уже существует, используется maintenance-команда uNews `editMessageMedia` или `editMessageCaption` по известному сообщению без создания дубля.

'''
          path.write_text(before + replacement + end + after, encoding="utf-8")
          PY

      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NEWS_PUBLISHING.md
          git commit -m "docs: define batch unpublished image repair rules"
          git push origin HEAD:fix/pending-publication-images-v23.8.1-v23.8.5
