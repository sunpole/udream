name: Validate uDream

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Validate repository, data, handoff, screenshot tooling and patchnotes
        run: node scripts/validate-project.mjs

      - name: Validate D1.2 dataset registry
        run: node scripts/validate-dataset-registry.mjs

      - name: Validate D1.3 deterministic data-quality reports
        run: node scripts/audit-data-quality.mjs --check

      - name: Validate D1.4 two-book architecture
        run: node scripts/validate-two-book-architecture.mjs

      - name: Require a new uNews patchnote for Pull Request changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-patchnote-diff.mjs

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check src/search.js
          node --check src/data.js
          node --check src/history.js
          node --check src/i18n.js
          node --check src/presentation.js
          node --check src/pwa.js
          node --check src/state.js
          node --check src/storage.js
          node --check tests/data.test.js
          node --check tests/history.test.js
          node --check tests/i18n.test.js
          node --check tests/presentation.test.js
          node --check tests/pwa.test.js
          node --check tests/state.test.js
          node --check tests/storage.test.js
          node --check tests/search.test.js
          node --check sw.js
          node --check versions/v3.0.0/script.js
          node --check versions/v3.0.0/sw.js
          node --check scripts/validate-project.mjs
          node --check scripts/validate-data-provenance.mjs
          node --check scripts/validate-dataset-registry.mjs
          node --check scripts/audit-data-quality.mjs
          node --check scripts/validate-two-book-architecture.mjs
          node --check scripts/validate-patchnote-diff.mjs
          node --check scripts/validate-screenshot-tooling.mjs
          node --check tools/screenshots/playwright.config.mjs
          node --check tools/screenshots/prepare-artifacts.mjs
          node --check tools/screenshots/capture.spec.mjs
