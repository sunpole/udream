name: Generate v23.8.6 documentation image

on:
  push:
    branches:
      - ops/unified-ai-workflow-v23.8.6
    paths:
      - tools/screenshots/v23.8.6-work-status.svg
      - .github/workflows/generate-v23.8.6-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ops/unified-ai-workflow-v23.8.6
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1

      - name: Render factual PNG
        run: |
          python - <<'PY'
          import cairosvg

          cairosvg.svg2png(
              url='tools/screenshots/v23.8.6-work-status.svg',
              write_to='news/2026-07-22-udream-v23-8-6-unified-ai-workflow.png',
              output_width=1200,
              output_height=875,
          )
          PY

          file news/2026-07-22-udream-v23-8-6-unified-ai-workflow.png
          test "$(stat -c%s news/2026-07-22-udream-v23-8-6-unified-ai-workflow.png)" -gt 10000

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/2026-07-22-udream-v23-8-6-unified-ai-workflow.png

          if git diff --cached --quiet; then
            echo "Image is already current."
            exit 0
          fi

          git commit -m "docs: add v23.8.6 real workflow render"
          git push origin HEAD:ops/unified-ai-workflow-v23.8.6
