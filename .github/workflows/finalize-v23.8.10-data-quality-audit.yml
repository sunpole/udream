name: Finalize uDream v23.8.10 data-quality audit

on:
  push:
    branches:
      - audit/d1.3-data-quality-v23.8.10
    paths:
      - .github/workflows/finalize-v23.8.10-data-quality-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-udream-v23.8.10-data-quality-audit
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: audit/d1.3-data-quality-v23.8.10
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run complete D1.3 validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node scripts/validate-data-provenance.mjs
          node scripts/validate-dataset-registry.mjs
          node scripts/audit-data-quality.mjs --check
          node scripts/validate-project.mjs
          BASE_SHA="$(git rev-parse origin/main)" node scripts/validate-patchnote-diff.mjs
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js' '*.mjs')
          git diff --check

      - name: Verify protected paths are untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          forbidden='^(data/(bd2\.json|db\.json|divinity_code_ru\.json|report\.txt)|index\.html$|script\.js$|src/|sw\.js$|manifest\.json$|version\.json$|package\.json$|versions/|_archive/)'
          if printf '%s\n' "$changed" | grep -E "$forbidden"; then
            echo "Protected data/runtime/PWA/saved-version/archive path changed" >&2
            exit 1
          fi

      - name: Record verified result and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_HEAD="$(git rev-parse HEAD)"
          VERIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p docs/validation
          cat > docs/validation/D1.3_FINAL.md <<EOF
          # D1.3 final validation

          - Status: PASS
          - Verified branch head: \`$VERIFIED_HEAD\`
          - Verified at UTC: \`$VERIFIED_AT\`
          - GitHub Actions run: \`$GITHUB_RUN_ID\`
          - Workflow: \`$GITHUB_WORKFLOW\`
          - Functional release unchanged: \`v23.8.0\`
          - Data baseline candidate: \`23.8.10\`

          Completed checks:

          - regression tests;
          - D1.1 provenance validator;
          - D1.2 registry validator;
          - D1.3 deterministic report freshness and structural gate;
          - project/handoff/screenshot/patchnote validator;
          - Pull Request patchnote/new-image validator against current \`main\`;
          - JavaScript/MJS syntax checks;
          - whitespace/diff checks;
          - protected-path diff check.

          Protected existing data files, runtime, PWA, package metadata, saved versions and archive were absent from the diff.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/D1.3_FINAL.md
          git rm .github/workflows/finalize-v23.8.10-data-quality-audit.yml
          git commit -m "test: record verified D1.3 final validation"
          git push origin HEAD:audit/d1.3-data-quality-v23.8.10
