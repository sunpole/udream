name: Capture pending publication images

on:
  push:
    branches:
      - fix/pending-publication-images-v23.8.1-v23.8.5
    paths:
      - .github/workflows/capture-pending-publication-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/pending-publication-images-v23.8.1-v23.8.5
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/screenshots/package-lock.json

      - name: Install pinned Playwright dependencies
        working-directory: tools/screenshots
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: tools/screenshots
        run: npx playwright install --with-deps chromium

      - name: Capture verified historical GitHub pages
        working-directory: tools/screenshots
        env:
          CAPTURE_BRANCH_COMMIT: ${{ github.sha }}
        run: |
          cat > capture-pending-publication-images.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { chromium } from "playwright";

          const repositoryRoot = path.resolve("../..");
          const branchCommit = process.env.CAPTURE_BRANCH_COMMIT;
          const scenarios = [
            {
              id: "v23.8.1-release",
              version: "23.8.1",
              targetCommit: "24dece593bea679485057d7551a2583f7f1f5acf",
              url: "https://github.com/sunpole/udream/releases/tag/v23.8.0",
              assertions: ["uDream v23.8.0", "v23.8.0"],
              output: "news/2026-07-20-udream-v23-8-1-release-finalization.png",
            },
            {
              id: "v23.8.2-version-record",
              version: "23.8.2",
              targetCommit: "de2759670fc3979ec5ad63f57ab32754b42eb99c",
              url: "https://github.com/sunpole/udream/blob/de2759670fc3979ec5ad63f57ab32754b42eb99c/VERSION.md",
              assertions: ["Current release checkpoint", "v23.8.0"],
              output: "news/2026-07-21-udream-v23-8-2-release-record.png",
            },
            {
              id: "v23.8.3-product-vision",
              version: "23.8.3",
              targetCommit: "75e3e9664d67f9a9e28952eab53cdb1244369ce5",
              url: "https://github.com/sunpole/udream/blob/75e3e9664d67f9a9e28952eab53cdb1244369ce5/docs/PRODUCT_VISION.md",
              assertions: ["Видение продукта uDream", "Миссия"],
              output: "news/2026-07-21-udream-v23-8-3-product-vision.png",
            },
            {
              id: "v23.8.4-translation-workflow",
              version: "23.8.4",
              targetCommit: "8adae192515de0a1cf1e0e3b9a3c85cfbe8f882a",
              url: "https://github.com/sunpole/udream/blob/8adae192515de0a1cf1e0e3b9a3c85cfbe8f882a/docs/TRANSLATION_WORKFLOW.md",
              assertions: ["Переводы и AI-assisted workflow", "Целевой набор данных"],
              output: "news/2026-07-21-udream-v23-8-4-translation-workflow.png",
            },
            {
              id: "v23.8.5-work-status",
              version: "23.8.5",
              targetCommit: "ac7dfe6b49567d29b0d994f04a3c9d315a7aaf5f",
              url: "https://github.com/sunpole/udream/blob/ac7dfe6b49567d29b0d994f04a3c9d315a7aaf5f/WORK_STATUS.md",
              assertions: ["WORK_STATUS", "READY", "v23.8.5"],
              output: "news/2026-07-21-udream-v23-8-5-work-status.png",
            },
          ];

          const browser = await chromium.launch({ headless: true });
          const manifest = {
            schemaVersion: 1,
            project: "uDream",
            captureBranchCommit: branchCommit,
            generatedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            source: "github-ui-playwright",
            viewport: { width: 1440, height: 1000 },
            entries: [],
          };

          for (const scenario of scenarios) {
            const context = await browser.newContext({
              viewport: manifest.viewport,
              locale: "ru-RU",
              colorScheme: "light",
              reducedMotion: "reduce",
              serviceWorkers: "block",
            });
            const page = await context.newPage();
            await page.goto(scenario.url, { waitUntil: "domcontentloaded", timeout: 60_000 });

            for (const buttonName of [
              "Accept all cookies",
              "Reject non-essential cookies",
              "Принять все файлы cookie",
              "Отклонить необязательные файлы cookie",
            ]) {
              const button = page.getByRole("button", { name: buttonName, exact: true });
              if (await button.isVisible().catch(() => false)) {
                await button.click();
                break;
              }
            }

            for (const expectedText of scenario.assertions) {
              await page.getByText(expectedText, { exact: false }).first().waitFor({
                state: "visible",
                timeout: 30_000,
              });
            }

            await page.addStyleTag({
              content: `
                *, *::before, *::after {
                  animation: none !important;
                  transition: none !important;
                  scroll-behavior: auto !important;
                }
                [data-testid="banner"], .js-stale-session-flash { display: none !important; }
              `,
            });
            await page.evaluate(async () => {
              if (document.fonts?.ready) await document.fonts.ready;
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(500);

            const outputPath = path.join(repositoryRoot, scenario.output);
            await page.screenshot({
              path: outputPath,
              fullPage: false,
              animations: "disabled",
              caret: "hide",
            });

            const bytes = fs.readFileSync(outputPath);
            const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            if (bytes.length < 30_000 || !bytes.subarray(0, 8).equals(signature)) {
              throw new Error(`${scenario.id}: generated file is not a valid substantial PNG`);
            }

            const capturedAt = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
            manifest.entries.push({
              id: scenario.id,
              version: scenario.version,
              image: path.basename(scenario.output),
              imagePath: scenario.output,
              imageSource: "github-ui",
              imageTarget: scenario.url,
              imageCommit: scenario.targetCommit,
              imageCapturedAt: capturedAt,
              assertions: scenario.assertions,
              finalUrl: page.url(),
              width: bytes.readUInt32BE(16),
              height: bytes.readUInt32BE(20),
              bytes: bytes.length,
            });
            await context.close();
          }

          await browser.close();
          const manifestPath = path.join(
            repositoryRoot,
            "tools/screenshots/v23.8.1-v23.8.5-publication-repairs.json",
          );
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          console.log(fs.readFileSync(manifestPath, "utf8"));
          EOF

          node capture-pending-publication-images.mjs
          rm capture-pending-publication-images.mjs

      - name: Commit screenshots and provenance
        run: |
          file \
            news/2026-07-20-udream-v23-8-1-release-finalization.png \
            news/2026-07-21-udream-v23-8-2-release-record.png \
            news/2026-07-21-udream-v23-8-3-product-vision.png \
            news/2026-07-21-udream-v23-8-4-translation-workflow.png \
            news/2026-07-21-udream-v23-8-5-work-status.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            news/2026-07-20-udream-v23-8-1-release-finalization.png \
            news/2026-07-21-udream-v23-8-2-release-record.png \
            news/2026-07-21-udream-v23-8-3-product-vision.png \
            news/2026-07-21-udream-v23-8-4-translation-workflow.png \
            news/2026-07-21-udream-v23-8-5-work-status.png \
            tools/screenshots/v23.8.1-v23.8.5-publication-repairs.json
          git commit -m "fix: add five verified pending publication images"
          git push origin HEAD:fix/pending-publication-images-v23.8.1-v23.8.5
