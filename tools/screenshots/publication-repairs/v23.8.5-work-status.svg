<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#071426"/>
          <stop offset="1" stop-color="#172554"/>
        </linearGradient>
        <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#38bdf8"/>
          <stop offset="1" stop-color="#818cf8"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
        </filter>
      </defs>
      <rect width="1200" height="675" fill="url(#bg)"/>
      <circle cx="1090" cy="70" r="180" fill="#2563eb" opacity="0.15"/>
      <circle cx="70" cy="650" r="210" fill="#06b6d4" opacity="0.10"/>
      <text x="72" y="82" fill="#7dd3fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700">uDream · проверенный исторический документ</text>
      <text x="72" y="140" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="800">Работа с любого устройства</text>
      <text x="72" y="181" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">WORK_STATUS.md в завершённом baseline состоянии READY</text>
      <rect x="72" y="213" width="1056" height="4" rx="2" fill="url(#line)"/>
      <rect x="72" y="245" width="1056" height="342" rx="28" fill="#0b1224" stroke="#334155" filter="url(#shadow)"/>
      <text x="92" y="285" fill="#e2e8f0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">WORK_STATUS — передача работы между устройствами</text><text x="92" y="315" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Этот файл — единая оперативная точка продолжения разработки uDream с телефона,</text><text x="92" y="345" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">рабочего ПК, MacBook или другого устройства.</text><text x="92" y="375" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Он отвечает на пять вопросов:</text><text x="92" y="405" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">1. Начата ли сейчас работа?</text><text x="92" y="435" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">2. Какая цель и в какой ветке выполняется?</text><text x="92" y="465" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">3. Что уже сделано фактически?</text><text x="92" y="495" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">4. Где именно остановились?</text><text x="92" y="525" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">5. Какой следующий точный шаг?</text><text x="92" y="555" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">ROADMAP.md хранит общий план проекта, docs/PROJECT_STATE.md — проверенное</text>
      <text x="72" y="625" fill="#94a3b8" font-family="DejaVu Sans Mono, monospace" font-size="16">Источник: WORK_STATUS.md</text>
      <text x="72" y="651" fill="#64748b" font-family="DejaVu Sans Mono, monospace" font-size="15">commit: ac7dfe6b49567d29b0d994f04a3c9d315a7aaf5f</text>
    </svg>