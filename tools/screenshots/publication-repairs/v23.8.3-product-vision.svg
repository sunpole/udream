<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#071426"/>
          <stop offset="1" stop-color="#172554"/>
        </linearGradient>
        <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#38bdf8"/>
          <stop offset="1" stop-color="#818cf8"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
        </filter>
      </defs>
      <rect width="1200" height="675" fill="url(#bg)"/>
      <circle cx="1090" cy="70" r="180" fill="#2563eb" opacity="0.15"/>
      <circle cx="70" cy="650" r="210" fill="#06b6d4" opacity="0.10"/>
      <text x="72" y="82" fill="#7dd3fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700">uDream · проверенный исторический документ</text>
      <text x="72" y="140" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="800">Единое видение продукта</text>
      <text x="72" y="181" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">PRODUCT_VISION.md на историческом merge commit</text>
      <rect x="72" y="213" width="1056" height="4" rx="2" fill="url(#line)"/>
      <rect x="72" y="245" width="1056" height="342" rx="28" fill="#0b1224" stroke="#334155" filter="url(#shadow)"/>
      <text x="92" y="285" fill="#e2e8f0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">Видение продукта uDream</text><text x="92" y="315" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Миссия</text><text x="92" y="345" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">uDream превращает трудоёмкий ручной поиск по христианской литературе о снах и</text><text x="92" y="375" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">видениях в быстрый, понятный и проверяемый мобильный справочник.</text><text x="92" y="405" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Проект должен помогать пользователю:</text><text x="92" y="435" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">найти символ, синоним или связанную тему;</text><text x="92" y="465" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">увидеть толкование и его источник;</text><text x="92" y="495" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">различать материалы разных книг и редакций;</text><text x="92" y="525" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">возвращаться к просмотренным карточкам;</text><text x="92" y="555" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">пользоваться справочником как сайтом и установленной PWA;</text><text x="92" y="585" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">сохранять доступ к проверенным прежним версиям проекта.</text><text x="92" y="615" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">uDream является поисковым интерфейсом к источникам, а не заменой исходных книг</text><text x="92" y="645" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">и не официальным изданием их содержания.</text><text x="92" y="675" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Для кого создаётся продукт</text><text x="92" y="705" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Основной сценарий — человек открывает uDream на телефоне, вводит слово из сна</text><text x="92" y="735" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">и быстро получает подходящие карточки без просмотра больших PDF-файлов.</text><text x="92" y="765" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Дополнительные сценарии:</text><text x="92" y="795" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">изучение связанных символов и библейских ссылок;</text>
      <text x="72" y="625" fill="#94a3b8" font-family="DejaVu Sans Mono, monospace" font-size="16">Источник: docs/PRODUCT_VISION.md</text>
      <text x="72" y="651" fill="#64748b" font-family="DejaVu Sans Mono, monospace" font-size="15">commit: 75e3e9664d67f9a9e28952eab53cdb1244369ce5</text>
    </svg>