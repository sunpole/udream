      <text x="92" y="285" fill="#e2e8f0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">Version</text><text x="92" y="315" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Current release checkpoint</text><text x="92" y="345" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">v23.8.0</text><text x="92" y="375" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Tag commit: 24dece593bea679485057d7551a2583f7f1f5acf</text><text x="92" y="405" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Published: 2026-07-20</text><text x="92" y="435" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Purpose: preserve the verified PWA update, cache migration and installation</text><text x="92" y="465" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">flow release</text><text x="92" y="495" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Release: https://github.com/sunpole/udream/releases/tag/v23.8.0</text><text x="92" y="525" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Verification: the immutable tag resolves to the exact functional merge commit;</text><text x="92" y="555" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">the release workflow re-runs tests, project validation, syntax checks and</text><text x="92" y="585" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">version consistency before publication</text><text x="92" y="615" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Runtime version sources: package.json, src/version.js and version.json all</text><text x="92" y="645" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">contain 23.8.0</text><text x="92" y="675" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Database: the active 4,086-record JSON database is unchanged</text><text x="92" y="705" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Previous checkpoint: v23.7.0</text><text x="92" y="735" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Current development line</text><text x="92" y="765" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">No functional development version is assigned after v23.8.0.</text><text x="92" y="795" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Documentation updates 23.8.1 and 23.8.2 finalize the immutable tag, GitHub</text>
